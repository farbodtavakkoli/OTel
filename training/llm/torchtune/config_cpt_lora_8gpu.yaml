# torchtune continued pre-training (LoRA), 8-GPU DISTRIBUTED variant.
#
# Recipe: lora_finetune_distributed  (NOT lora_finetune_single_device).
# The two recipes are different programs with different config surfaces:
# the distributed one reads fsdp_* / custom_sharded_layers and rejects
# single-device-only keys (optimizer_in_bwd, low-bit optimizers).
#
# Launch (from inside training/llm/torchtune/):
#   tune run --nnodes 1 --nproc_per_node 8 lora_finetune_distributed \
#       --config config_cpt_lora_8gpu.yaml
#
# Tested on 8x MI355X / ROCm 7.2.4 — see readme_torchtune.md §7a.
# Kept separate from config_cpt_lora.yaml (the proven 1-GPU config) on purpose.

output_dir: ./outputs/torchtune_cpt_lora_8gpu

model:
  # Same model the 1-GPU smoke used (Qwen2.5-0.5B), not the untested 7B default.
  _component_: torchtune.models.qwen2_5.lora_qwen2_5_0_5b
  lora_attn_modules: ['q_proj', 'v_proj', 'output_proj']
  apply_lora_to_mlp: True
  apply_lora_to_output: False
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.0

tokenizer:
  _component_: torchtune.models.qwen2_5.qwen2_5_tokenizer
  path: ./assets/Qwen2.5-0.5B/vocab.json
  merges_file: ./assets/Qwen2.5-0.5B/merges.txt
  max_seq_len: 2048

checkpointer:
  _component_: torchtune.training.FullModelHFCheckpointer
  checkpoint_dir: ./assets/Qwen2.5-0.5B
  checkpoint_files: [model.safetensors]
  recipe_checkpoint: null
  output_dir: ${output_dir}
  model_type: QWEN2
resume_from_checkpoint: False
# Adapter-only writes: 0.02 GiB/epoch instead of a full 0.92 GiB model copy.
save_adapter_weights_only: True

dataset:
  _component_: torchtune.datasets.text_completion_dataset
  source: json
  # Override on the CLI (dataset.data_files=...) with a larger corpus — e.g. a
  # replicated copy of the sample — since the shipped 10 rows cannot feed 8 ranks.
  data_files: ./data/otel_cpt.jsonl
  column: text
  split: train
  packed: True

seed: 42
shuffle: True

optimizer:
  _component_: torch.optim.AdamW
  fused: True
  weight_decay: 0.01
  lr: 1.0e-4
lr_scheduler:
  _component_: torchtune.training.lr_schedulers.get_cosine_schedule_with_warmup
  num_warmup_steps: 5

# LinearCrossEntropyLoss is a post-0.6 main-branch API and does NOT exist in
# 0.6.1 (InstantiationError on any platform). Same fix as the 1-GPU config.
loss:
  _component_: torchtune.modules.loss.CEWithChunkedOutputLoss

epochs: 1
batch_size: 2
max_steps_per_epoch: 20
gradient_accumulation_steps: 1
clip_grad_norm: 1.0
compile: False

# ---- distributed-only knobs (ignored by the single-device recipe) ----
# FSDP2 (fully_shard) across the world. reshard_after_forward=True is full
# FSDP; set False for SHARD_GRAD_OP-style behaviour (more VRAM, less comm).
fsdp_cpu_offload: False
fsdp_reshard_after_forward: True
# custom_sharded_layers: left unset — Qwen2.5-0.5B ties its embedding/output
# weights, so naming 'output' here is not a separately shardable module.

metric_logger:
  _component_: torchtune.training.metric_logging.DiskLogger
  log_dir: ${output_dir}/logs
log_every_n_steps: 1
log_peak_memory_stats: True
log_level: INFO

device: cuda
dtype: bf16
enable_activation_checkpointing: True
enable_activation_offloading: False

profiler:
  _component_: torchtune.training.setup_torch_profiler
  enabled: False
  output_dir: ${output_dir}/profiling_outputs
  cpu: True
  cuda: True
  profile_memory: False
  with_stack: False
  record_shapes: True
  with_flops: False
  wait_steps: 5
  warmup_steps: 3
  active_steps: 2
  num_cycles: 1
