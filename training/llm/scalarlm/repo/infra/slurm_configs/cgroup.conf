CgroupPlugin=cgroup/docker
CgroupMountpoint=/tmp/cgroup
ConstrainCores=yes
# ConstrainDevices=no on ROCm. discover_clusters.write_gres_config maps each GPU
# gres to /dev/dri/card<N>, but HIP/ROCm actually needs /dev/kfd plus the RENDER
# node (/dev/dri/renderD<N>). With ConstrainDevices=yes the Slurm cgroup admits
# only the allocated card* node and denies /dev/kfd + renderD*, so inside a
# training job torch.cuda.is_available() is False and the run SILENTLY falls back
# to CPU (job still reports COMPLETED, ~700x slower: 317s/step vs 0.58s/step on
# 8x MI355X). The container already scopes device access at the Docker level
# (--device=/dev/kfd --device=/dev/dri), so this constraint adds nothing here.
# Proper upstream fix: emit renderD* in gres.conf and always allow /dev/kfd.
ConstrainDevices=no
ConstrainRAMSpace=yes
