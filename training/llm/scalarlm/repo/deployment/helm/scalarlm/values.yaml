image:
  repository: gdiamos/scalarlm-nvidia-12.0
  tag: v1.0rc13
  pullPolicy: IfNotPresent

imagePullSecrets: []

model: Qwen/Qwen3-14B
gpu_memory_utilization: 0.85
max_train_time: 86400
extraConfig: {}

replicaCounts:
  inference: 1
  training: 1

service:
  type: ClusterIP
  api_port: 8000
  ui_port: 3000
  vllm_port: 8001
  slurmctld_port: 6817
  slurmd_port: 6818

storage:
  jobs:
    size: 100Gi
    storageClass: longhorn
    accessMode: ReadWriteMany
  slurmConfig:
    size: 1Gi
    storageClass: longhorn
    accessMode: ReadWriteMany
  cache:
    kind: pvc
    size: 50Gi
    storageClass: longhorn
    accessMode: ReadWriteOnce
    hostPath: /root/.cache

api:
  resources:
    limits:
      nvidia.com/gpu: 0
  extraEnv: {}
  hostPort: false
  nodeAffinityHostnames: []
  probes:
    enabled: true
    livenessPath: /v1/health
    readinessPath: /v1/health
    startup:
      periodSeconds: 30
      failureThreshold: 30

vllm:
  enabled: true
  resources:
    limits:
      nvidia.com/gpu: 1
  extraArgs: []
  extraEnv: {}
  nodeAffinityHostnames: []
  probes:
    enabled: true
    livenessPath: /health
    readinessPath: /health
    startup:
      periodSeconds: 30
      failureThreshold: 60

megatron:
  enabled: true
  hostPID: true
  hostIPC: false
  resources:
    limits:
      nvidia.com/gpu: 1
  extraResources: {}
  capabilities:
    - NET_ADMIN
    - SYS_ADMIN
    - IPC_LOCK
    - SYS_RESOURCE
    - SYS_RAWIO
  extraCapabilities: []
  extraEnv: {}
  extraVolumes: []
  dshm:
    kind: disabled
    sizeLimit: 64Gi
    hostPath: /dev/shm
  nodeAffinityHostnames: []
  probes:
    enabled: true
    tcpPort: 6818
    startup:
      periodSeconds: 20
      failureThreshold: 30

cloudflared:
  enabled: false
  image: cloudflare/cloudflared:2024.8.3
  tunnelToken: ""
  existingSecret: ""
