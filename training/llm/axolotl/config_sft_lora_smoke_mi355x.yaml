# MI355X (ROCm 7.2) smoke variant of config_sft_lora.yaml — single GPU, ~5 steps.
# The two ROCm-required deltas vs config_sft_lora.yaml are `attn_implementation: sdpa`
# (flash-attn has no ROCm build) and `tf32: false` (tf32 raises on ROCm); the rest is
# smoke-run sizing.
# Launch: python3 train_llm_axolotl.py --config config_sft_lora_smoke_mi355x.yaml --num-processes 1

### model
base_model: Qwen/Qwen3-0.6B
trust_remote_code: false

### data
datasets:
  - path: ./data/OTel_LLM_sample_10.jsonl
    ds_type: json
    split: train
    type: chat_template
    field_messages: messages
    message_property_mappings:
      role: role
      content: content
    roles_to_train: ["assistant"]
    train_on_eos: turn

chat_template: tokenizer_default

dataset_prepared_path: ./last_run_prepared_smoke_mi355x
val_set_size: 0
output_dir: ./outputs/sft-lora-smoke-mi355x

### sequence handling
sequence_len: 512
sample_packing: false
pad_to_sequence_len: false

### adapter (LoRA)
adapter: lora
lora_r: 64
lora_alpha: 128
lora_dropout: 0.0
lora_target_linear: true

### batch / optimizer
micro_batch_size: 1
gradient_accumulation_steps: 1
num_epochs: 3
max_steps: 5
learning_rate: 2.0e-4
optimizer: adamw_torch_fused
lr_scheduler: cosine
warmup_ratio: 0.03
weight_decay: 0.0
max_grad_norm: 1.0

### precision / kernels
bf16: true
tf32: false
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
attn_implementation: sdpa

### logging / checkpoints
logging_steps: 1
saves_per_epoch: 1
save_total_limit: 1
seed: 42
