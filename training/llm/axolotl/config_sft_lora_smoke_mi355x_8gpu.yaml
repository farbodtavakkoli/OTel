# 8x MI355X (ROCm 7.2.4) smoke variant — derived from config_sft_lora_smoke_mi355x.yaml.
# No deepspeed:/fsdp: block — plain torch DDP across 8 ranks (see readme "Multi-GPU").
#
# Required data prep: the shipped 10-row sample cannot feed 8 ranks at global batch 16,
# so this config points at a generated 640-row replica. Create it once from this folder
# (awk, not cat: the shipped sample has no trailing newline, and cat would glue records
# together into invalid JSON lines):
#   mkdir -p outputs/data && for i in $(seq 64); do \
#     awk '{print}' data/OTel_LLM_sample_10.jsonl; \
#   done > outputs/data/otel_sample_x64.jsonl
# Replicated data makes this a pipeline proof, not a learning result.
#
# Launch (hold a machine-wide lock if other jobs share the GPUs; see readme_axolotl.md
# section 5 "Multi-GPU"):
#   python3 train_llm_axolotl.py --config config_sft_lora_smoke_mi355x_8gpu.yaml \
#       --num-processes 8 --main-process-port 29700

### model
base_model: Qwen/Qwen3-0.6B
trust_remote_code: false

### data
datasets:
  - path: ./outputs/data/otel_sample_x64.jsonl   # generated; see the header comment
    ds_type: json
    split: train
    type: chat_template
    field_messages: messages
    message_property_mappings:
      role: role
      content: content
    roles_to_train: ["assistant"]
    train_on_eos: turn

chat_template: tokenizer_default

dataset_prepared_path: ./last_run_prepared_smoke_mi355x_8gpu
val_set_size: 0
output_dir: ./outputs/sft-lora-smoke-mi355x-8gpu

### sequence handling
sequence_len: 512
sample_packing: false
pad_to_sequence_len: false

### adapter (LoRA)
adapter: lora
lora_r: 64
lora_alpha: 128
lora_dropout: 0.0
lora_target_linear: true

### batch / optimizer
micro_batch_size: 2
gradient_accumulation_steps: 1
num_epochs: 1
max_steps: 20
learning_rate: 2.0e-4
optimizer: adamw_torch_fused
lr_scheduler: cosine
warmup_ratio: 0.03
weight_decay: 0.0
max_grad_norm: 1.0

### precision / kernels
bf16: true
tf32: false
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
attn_implementation: sdpa

### logging / checkpoints (smoke run: no checkpoint writes)
logging_steps: 1
save_strategy: "no"
saves_per_epoch: null
save_total_limit: 1
seed: 42
