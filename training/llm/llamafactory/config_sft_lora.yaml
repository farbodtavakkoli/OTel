# LLaMA-Factory - LoRA SFT on chat JSONL. Single node, 8x H100 80GB.
# Launch: python3 train_llm_llamafactory.py --config config_sft_lora.yaml
# Key names follow upstream examples/train_lora/qwen3_lora_sft.yaml and the
# hparams dataclasses in src/llamafactory/hparams/.

### model
model_name_or_path: Qwen/Qwen3-8B
trust_remote_code: true
flash_attn: fa2                 # choices: [auto, disabled, sdpa, fa2, fa3]
# enable_liger_kernel: true     # optional: fused kernels, lower memory on large vocabs

### method
stage: sft                      # choices: [pt, sft, rm, ppo, dpo, kto]
do_train: true
finetuning_type: lora           # choices: [lora, oft, freeze, full]
lora_rank: 64
lora_alpha: 128                 # defaults to lora_rank * 2 when omitted
lora_dropout: 0.0
lora_target: all                # all linear modules

### dataset
# `dataset` names must exist in <dataset_dir>/dataset_info.json (see data/dataset_info.json).
dataset: otel_chat_sft
dataset_dir: ./data
template: qwen3_nothink         # MUST match the model; same template at inference time
cutoff_len: 4096
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4
packing: false                  # true packs sequences; neat_packing: true also blocks cross-attention

### output
output_dir: saves/qwen3-8b/lora/sft
logging_steps: 10
save_steps: 500
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none                 # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4  # effective batch = 4 x 4 x 8 GPUs = 128
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
# Gradient checkpointing is ON by default; turn it off with disable_gradient_checkpointing: true
ddp_timeout: 180000000
seed: 42
resume_from_checkpoint: null

### eval
val_size: 0.02
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 500
