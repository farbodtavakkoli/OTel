# Primus post-training config -- LoRA, Qwen3-32B, MI300X (gfx942).
# MI325X shares this config (both are gfx942).

work_group: local
user_name: local
exp_name: qwen3_32b_lora_posttrain
# REQUIRED by primus/core/launcher/parser.py::parse_meta_info -- omitting it aborts with
# "AssertionError: Failed to find key(workspace)".
workspace: ${PRIMUS_WORKSPACE:./output}

modules:
  post_trainer:
    framework: megatron_bridge
    config: sft_trainer.yaml
    model: qwen3_32b.yaml

    overrides:
      peft: lora

      # LoRA needs a much higher LR than SFT: 1e-4 to 5e-4.
      finetune_lr: 1.0e-4
      min_lr: 1.0e-5
      lr_warmup_iters: 20
      lr_decay_iters: 500

      precision_config: bf16_mixed

      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      context_parallel_size: 1
      # MUST be false when tensor_model_parallel_size is 1 -- Megatron raises
      # "Cannot use sequence parallelism without tensor parallelism".
      sequence_parallel: false

      train_iters: 500
      global_batch_size: 32
      micro_batch_size: 2
      seq_length: 8192

      recompute_granularity: full
      recompute_method: uniform
      recompute_num_layers: 1
